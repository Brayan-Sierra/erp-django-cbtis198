{% extends "base.html" %}
{% load allauth %}
{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<div style="display:flex;justify-content:center;
            align-items:center;min-height:60vh;">
    <div class="erp-card" style="width:100%;max-width:420px;border-top: 4px solid #8b0000;">
        <div class="erp-card-header" style="text-align:center;font-weight:700;color:#8b0000;font-size:1.25rem;">
            🔐 Iniciar sesión · ERP Django
        </div>

        <form method="post" action="{% url 'account_login' %}"
              style="margin-top:.5rem;">
            {% csrf_token %}

            <!-- Username -->
            <div class="mb-4">
                <label class="erp-label" style="color:#8b0000;">Usuario</label>
                <input type="text" name="login"
                       class="erp-input"
                       placeholder="Tu nombre de usuario"
                       autofocus required>
            </div>

            <!-- Password -->
            <div class="mb-4">
                <label class="erp-label" style="color:#8b0000;">Contraseña</label>
                <input type="password" name="password"
                       class="erp-input"
                       placeholder="••••••••" required>
            </div>

            <!-- Errores del formulario -->
            {% if form.errors %}
            <div class="erp-alert-danger" style="margin-bottom:1rem;background-color:#ffe6e6;color:#8b0000;padding:.6rem;border-radius:6px;border:1px solid #8b0000;font-size:.88rem;text-align:center;">
                Usuario o contraseña incorrectos.
            </div>
            {% endif %}

            <!-- Botón Rojo Carmesí -->
            <button type="submit" class="btn-erp-primary"
                    style="width:100%;padding:.6rem;font-size:1rem;background-color:#8b0000 !important;border-color:#8b0000 !important;color:#ffffff !important;">
                Entrar
            </button>
        </form>

        <p style="text-align:center;margin-top:1rem;
                  color:var(--clr-muted);font-size:.88rem;">
            ¿No tienes cuenta?
            <a href="{% url 'account_signup' %}"
               style="color:#8b0000;font-weight:600;text-decoration:underline;">Regístrate aquí</a>
        </p>
    </div>
</div>
{% endblock %}
